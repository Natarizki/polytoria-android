name: Android APK

on:
  push:
    branches:
      - android-development
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.0
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PT_BUILD_TARGET: MOBILE

jobs:
  android-apk:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          yes | sdkmanager --licenses

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Godot .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
          cache: true

      - name: Configure Godot Android export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          mkdir -p "$RUNNER_TEMP/android-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android-signing/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          cp Polytoria/export_presets.cfg.template Polytoria/export_presets.cfg

      - name: Restore .NET project
        run: dotnet restore Polytoria/Polytoria.csproj

      - name: Build Godot C# project
        run: |
          cd Polytoria
          godot --headless --editor --build-solutions --quit

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/android-signing/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path Polytoria \
            --export-debug "Client Android APK" \
            build/Polytoria-Android-arm64.apk

      - name: Verify APK
        run: |
          test -s build/Polytoria-Android-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging \
            build/Polytoria-Android-arm64.apk | head -n 8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: polytoria-android-arm64-debug
          path: build/Polytoria-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14
